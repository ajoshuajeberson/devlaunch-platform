name: DevLaunch CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate API and Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sample API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/sample-api
          push: false
          tags: devlaunch/sample-api:ci

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint ./charts/sample-api

      - name: Validate rendered Helm manifests
        run: helm template sample-api ./charts/sample-api --namespace devlaunch-dev
