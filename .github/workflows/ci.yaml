
name: DevLaunch CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Build, validate, and scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sample API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/sample-api
          load: true
          push: false
          tags: devlaunch/sample-api:ci

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint ./charts/sample-api

      - name: Validate rendered Helm manifests
        run: helm template sample-api ./charts/sample-api --namespace devlaunch-dev

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: devlaunch/sample-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH


