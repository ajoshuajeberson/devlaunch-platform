name: DevLaunch CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    name: Build, validate, and scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run API unit tests
        working-directory: ./apps/sample-api
        run: python -m unittest discover -s tests -v
      - name: Build sample API image
        run: |
          docker build \
            -t devlaunch/sample-api:ci \
            -t ghcr.io/${{ github.repository }}/sample-api:${{ github.sha }} \
            ./apps/sample-api

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint ./charts/sample-api

      - name: Validate rendered Helm manifests
        run: helm template sample-api ./charts/sample-api --namespace devlaunch-dev

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: devlaunch/sample-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/${{ github.repository }}/sample-api:${{ github.sha }}


