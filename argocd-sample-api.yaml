apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ajoshuajeberson/devlaunch-platform.git
    targetRevision: master
    path: charts/sample-api
    helm:
      releaseName: sample-api-gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: devlaunch-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
